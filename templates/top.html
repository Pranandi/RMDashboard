<!DOCTYPE html>
<html lang="en">
  {% load static %}
  <head>
    <meta charset="utf-8">
    <title>Release Management Dashboard</title>
    <!-- Main CSS-->
  <link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" type="text/css" href="{% static 'css/custom.css' %}">
    <!-- Font-icon css-->
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/datatables.min.css' %}">
  </head>
  <body class="app sidebar-mini">
    <!-- Navbar-->
    {% include 'menu.html' %}
    
    <!-- Dynamic content will be injected here -->
     <main class="app-content">
    {% block content %}
    
    {% endblock %}
     </main>
    <footer>
      <div class="text-center py-2">© 2026 Copyright: Release Management Team@Lumen
    </div>
    </footer>
    <script type="text/javascript" src="{% static 'js/jquery-3.7.0.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/bootstrap.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/main.js' %}"></script>
     <!-- Data table plugin-->
    <script type="text/javascript" src="{% static 'js/plugins/jquery.dataTables.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/plugins/dataTables.bootstrap.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/plugins/chart.js' %}"></script>
    {% block scripts %}

    {% endblock %}
  </body>
</html>
