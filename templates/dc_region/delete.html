{% extends 'base.html' %}

{% block content %}
<div class="row">
  <div class="col-md-12">
    <div class="tile">
      <div class="tile-body">
        <form method="post" action="{% url 'dc_region:delete' item.id %}">
          {% csrf_token %}
          <p>Are you sure you want to delete this record for <b>{{ item.site_id }}</b>?</p>
          <div class="col-md-12 text-end">
            <button class="btn btn-danger" type="submit">Delete</button>
            <a href="{% url 'dc_region:view' %}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
